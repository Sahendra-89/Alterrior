<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <!-- Geometric A mark — triangular with inner cut, dark red/maroon -->
  <g>
    <!-- Outer triangle -->
    <polygon points="22,6 4,46 40,46" fill="#8B1A1A" opacity="0.92"/>
    <!-- Inner white triangle cutout -->
    <polygon points="22,16 11,40 33,40" fill="#F2EDE4"/>
    <!-- Small square/diamond accent at top -->
    <rect x="19" y="3" width="6" height="6" rx="1" fill="#C0392B" transform="rotate(5 22 6)"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="30" font-family="Georgia, serif" font-size="19" font-weight="500" letter-spacing="2.5" fill="#2A2318">Altera</text>
  <text x="117" y="30" font-family="Georgia, serif" font-size="19" font-weight="300" letter-spacing="2" fill="#5C7A65"> interior</text>
  <!-- Tagline -->
  <text x="52" y="44" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" letter-spacing="3.5" fill="#8A7E70">the modern home maker</text>
</svg>
